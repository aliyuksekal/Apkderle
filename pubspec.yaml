name: namaz_asistani
description: "Yaşlı dostu Namaz Asistanı — vakitler, zikirmatik, kıble, dualar ve eller serbest namaz rehberi."
publish_to: 'none'

version: 0.2.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.0
  # shared_preferences_android JNI kullanır; JNI'yi Android'e bağlayan parça.
  # Eksik olursa uygulama açılışta (ayarlar okunurken) kapanır.
  jni_flutter: ^1.0.4
  path_provider: ^2.1.6
  geolocator: ^14.0.0
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.3.1
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - content/
    - content/flows/
    - content/audio/husary/
  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
