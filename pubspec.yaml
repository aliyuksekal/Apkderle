name: namaz_asistani
description: "Yaşlı dostu Namaz Asistanı — vakitler, zikirmatik, kıble, dualar ve eller serbest namaz rehberi."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.0
  geolocator: ^14.0.0
  audioplayers: ^6.8.0
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - content/
    - content/flows/
    - content/audio/husary/
  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
