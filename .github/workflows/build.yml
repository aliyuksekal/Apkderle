name: APK Derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Paketler
        run: flutter pub get

      - name: Kod denetimi
        run: flutter analyze

      - name: Testler
        run: flutter test

      - name: İmza anahtarı (varsa)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Gerçek imza anahtarı kullanılacak."
          else
            echo "KEYSTORE_BASE64 yok: test (debug) anahtarıyla imzalanacak."
          fi

      - name: AAB (Play) ve deneme APK'sı derle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        run: |
          BN=$(( 100 + ${{ github.run_number }} ))
          DEF=""
          if [ -n "$ADMOB_BANNER_ID" ]; then DEF="--dart-define=ADMOB_BANNER_ID=$ADMOB_BANNER_ID"; echo "Gerçek AdMob banner kimliği kullanılacak."; else echo "AdMob kimliği yok: test reklamı."; fi
          [ -z "$ADMOB_APP_ID" ] && unset ADMOB_APP_ID
          # Play'e yüklenecek paket (Pro satın almayla açılır)
          flutter build appbundle --release --build-number=$BN $DEF
          # Telefona kurup denemek için: Pro özellikleri açık
          flutter build apk --release --build-number=$BN $DEF --dart-define=PRO_TEST=true
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab dist/NamazAsistani-Play.aab
          cp build/app/outputs/flutter-apk/app-release.apk dist/NamazAsistani-Deneme.apk
          if [ -n "${KEYSTORE_PATH:-}" ]; then
            echo "IMZA=Play yükleme anahtarıyla imzalı (Play Console'a yüklenebilir)" >> "$GITHUB_ENV"
          else
            echo "IMZA=UYARI: imza anahtarı tanımlı değil, AAB Play'e yüklenemez" >> "$GITHUB_ENV"
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: NamazAsistani
          path: dist/

      - name: Telefondan indirilebilir sürüm (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=son-surum
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" dist/NamazAsistani-Deneme.apk dist/NamazAsistani-Play.aab \
            --title "Namaz Asistanı — son derleme (#${{ github.run_number }})" \
            --notes "NamazAsistani-Deneme.apk: telefona kurup denemek için (Pro özellikleri açık). NamazAsistani-Play.aab: Play Console'a yüklenecek paket. $IMZA. Commit: ${{ github.sha }}" \
            --prerelease
