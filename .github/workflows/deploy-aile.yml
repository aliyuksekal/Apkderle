name: Aile Sunucusunu Yayınla

# "Annem Kıldı Mı?" için Cloudflare Worker. Gerekli gizli değişkenler:
#   CLOUDFLARE_API_TOKEN  (Workers Scripts:Edit + Workers KV Storage:Edit)
#   CLOUDFLARE_ACCOUNT_ID
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-aile.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sunucu testleri
        run: node server/worker.test.mjs
      - name: Yayınla
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: server
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID gizli değişkenleri yok; yayınlama atlandı."
            exit 0
          fi
          npm i -g wrangler@4 >/dev/null
          TITLE=namaz-aile-AILE
          find_id() { wrangler kv namespace list 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s.slice(s.indexOf('[')));const n=a.find(x=>x.title===process.argv[1]||x.title.endsWith(process.argv[1]));console.log(n?n.id:'')})" "$TITLE"; }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            wrangler kv namespace create "$TITLE"
            ID=$(find_id)
          fi
          [ -z "$ID" ] && { echo "KV oluşturulamadı"; exit 1; }
          sed -i "s/__KV_ID__/$ID/" wrangler.toml
          wrangler deploy
          echo "Adres: https://namaz-aile.<hesap-alt-alan-adı>.workers.dev"
